name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A src/ change that lands on main without a version bump is published by
  # nobody: publish-cli.yml only publishes a version npm doesn't already have,
  # so it silently no-ops and the change never reaches `npm install hacklab`.
  # That failure is invisible — CI is green, the PR merges, and the feature just
  # isn't there. Hence a gate rather than a line in a doc.
  version-bump:
    name: Version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a version bump when src/ changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- src/; then
            echo "No src/ changes — no publish needed, no bump required."
            exit 0
          fi

          base_version=$(git show "$BASE_SHA":package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          head_version=$(node -p "require('./package.json').version")

          if [ "$base_version" = "$head_version" ]; then
            echo "::error::src/ changed but package.json version is still $head_version."
            echo "npm rejects a same-version publish, so merging this would ship nothing."
            echo "Bump the version (patch by default) so the change reaches npm."
            exit 1
          fi

          echo "src/ changed and version moved $base_version -> $head_version. Publishes on merge."

  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format & lint
        run: pnpm exec biome check .

      # `build` runs tsc, which type-checks (vitest runs TS without type-checking).
      - name: Build (typecheck)
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

  cli-windows:
    # The CLI must work on native Windows: it reads each agent's usage from the
    # Windows home and schedules a Task Scheduler sync. Run the vitest suite on a
    # real Windows runner so the Windows-only paths — the sql.js wasm reader (no
    # `sqlite3.exe` there), the schtasks builders, and the backslash-path Codex
    # date parsing — are exercised for real. Tests only (no build): the build
    # script (`rm -rf` + `chmod`) is POSIX-only.
    name: CLI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test
